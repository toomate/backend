# Converted from application.properties to application.yml
spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://localhost:3306/toomate
    username: toomate_user
    password: toomate_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

server:
  error:
    include-message: always
    include-binding-errors: always
  address: 0.0.0.0

# Token expiration in milliseconds (1 hour)
jwt:
  validity: 360000
  secret: ''

logging:
  level:
    com.toomate.backend: INFO

notificacao:
  endpoint:
    url: http://localhost:8181/notification
