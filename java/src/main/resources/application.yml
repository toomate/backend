# Converted from application.properties to application.yml
spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://localhost:3306/toomate?useUnicode=true&characterEncoding=UTF-8g&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: toomate_user
    password: toomate_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  rabbitmq:
    addresses: amqp://myuser:secret@localhost:5672/
    username: myuser
    password: secret
    virtual-host: /
    listener:
      simple:
        concurrency: 2
        max-concurrency: 10
  cache:
    type: redis

  data:
    redis:
      host: localhost
      port: 6379
server:
  error:
    include-message: always
    include-binding-errors: always
  address: 0.0.0.0

# Token expiration in milliseconds (1 hour)
jwt:
  validity: 360000
  secret: ''

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: backend

logging:
  level:
    com.toomate.backend: INFO
    org.springframework.cache.interceptor.CacheInterceptor: TRACE  # mostra hits/misses no log

broker:
  exchange:
    name: example.fanout.exchange
  queue:
    name: example.queue

audit:
  bucket: toomate-raw-2026
  prefix: logs/auditoria
